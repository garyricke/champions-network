# Champions Network — static site + serverless functions
# Publish the repo root as-is; run the Clockify budget proxy as a function.
[build]
  publish = "."
  functions = "netlify/functions"

# Short, speakable links for things that get shared or printed.
# Mark forwards the Advocate Weekly sample to prospective sources and agencies —
# he should never have to read out a filename with a .pdf on the end.
[[redirects]]
  from = "/advocate-sample"
  to = "/champions-advocate-weekly-sample.pdf"
  status = 200

# The proposal PDF pairs with the /proposal page. Mark forwards this to the
# board, so it should read as a sibling of the page, not as a filename.
[[redirects]]
  from = "/proposal.pdf"
  to = "/champions-network-proposal-sept2026.pdf"
  status = 200
